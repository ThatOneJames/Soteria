<div class="auth-page">
  <div class="auth-bg"></div>

  <div class="auth-card">
    <a routerLink="/" class="auth-logo">Soteria<span>Insurance</span></a>

    <div class="tab-switch">
      <button
        class="tab-btn"
        [class.tab-btn--active]="activeTab === 'login'"
        (click)="setTab('login')"
      >
        Log In
      </button>
      <button
        class="tab-btn"
        [class.tab-btn--active]="activeTab === 'signup'"
        (click)="setTab('signup')"
      >
        Sign Up
      </button>
    </div>

    <div class="auth-message auth-message--error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="auth-message auth-message--success" *ngIf="successMessage">{{ successMessage }}</div>

    <!-- LOGIN -->
    <form class="auth-form" *ngIf="activeTab === 'login'" (ngSubmit)="onLoginSubmit()">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input
          id="loginEmail"
          type="email"
          name="loginEmail"
          [(ngModel)]="loginForm.email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          type="password"
          name="loginPassword"
          [(ngModel)]="loginForm.password"
          placeholder="Enter your password"
          required
        />
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" name="remember" [(ngModel)]="loginForm.remember" />
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn" [disabled]="submitting">
        {{ submitting ? 'Logging in...' : 'Log In' }}
      </button>

      <p class="switch-text">
        Don't have an account?
        <button type="button" class="link-btn" (click)="setTab('signup')">Sign up</button>
      </p>
    </form>

    <!-- SIGN UP -->
    <form class="auth-form" *ngIf="activeTab === 'signup'" (ngSubmit)="onSignupSubmit()">
      <div class="form-row-split">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input
            id="firstName"
            type="text"
            name="firstName"
            [(ngModel)]="signupForm.firstName"
            placeholder="Juan"
            required
          />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input
            id="lastName"
            type="text"
            name="lastName"
            [(ngModel)]="signupForm.lastName"
            placeholder="Dela Cruz"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="signupEmail">Email Address</label>
        <input
          id="signupEmail"
          type="email"
          name="signupEmail"
          [(ngModel)]="signupForm.email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input
          id="signupPassword"
          type="password"
          name="signupPassword"
          [(ngModel)]="signupForm.password"
          placeholder="At least 8 characters"
          required
        />
        <span class="field-hint field-hint--error" *ngIf="signupPasswordTooShort">
          Password must be at least 8 characters.
        </span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="signupForm.confirmPassword"
          placeholder="Re-enter your password"
          required
        />
        <span class="field-hint field-hint--error" *ngIf="signupPasswordsMismatch">
          Passwords do not match.
        </span>
      </div>

      <button type="submit" class="submit-btn" [disabled]="submitting">
        {{ submitting ? 'Creating account...' : 'Create Account' }}
      </button>

      <p class="switch-text">
        Already have an account?
        <button type="button" class="link-btn" (click)="setTab('login')">Log in</button>
      </p>
    </form>
  </div>
</div>
